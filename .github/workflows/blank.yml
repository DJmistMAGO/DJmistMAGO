name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]   # daily refresh
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: DJmistMAGO
          template: classic
          filename: github-metrics.svg

          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          config_order: header, isocalendar, languages, achievements, repositories, followup, people, stars, metadata
          config_animations: yes
          config_padding: 8, 8, 8

         
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: detailed       
          plugin_achievements_secrets: yes
          plugin_achievements_only: >-
            polyglot, stargazer, sponsor, deployer, member, maintainer,
            developer, scripter, packager, explorer, infographile

          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10                    
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used   
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage, bytes-size      

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          plugin_people: yes
          plugin_people_identicons: no                   
          plugin_people_limit: 24
          plugin_people_size: 32                          
          plugin_people_types: followers, following

          plugin_stars: yes
          plugin_stars_limit: 6                         

         
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_notable: yes
          plugin_notable_types: commit, pr, issue

          use_prebuilt_image: yes
